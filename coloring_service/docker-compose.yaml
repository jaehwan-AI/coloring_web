services:
  db:
    image: postgres:16-alpine
    container_name: coloring-db
    environment:
      POSTGRES_USER: coloring
      POSTGRES_PASSWORD: coloring
      POSTGRES_DB: coloring_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coloring-backend
    env_file:
      - .env
    environment:
      # DB
      DATABASE_URL: postgresql+psycopg://coloring:coloring@db:5432/coloring_db
    
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
